<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="../videos/sampleVideo.mp4" controls type="videos/mp4"></video>

    <!-- width & height -->
     <video src="../videos/mp4videoWaudio.mp4" controls type="videos/mp4" width="640" height="360"></video>

     <!-- autoplay -->
     <video src="../videos/sampleVideo.mp4" controls type="videos/mp4" autoplay></video>

     <!-- Muted -->
    <video src="../videos/mp4videoWaudio.mp4" controls autoplay muted width="640" height="360"></video>

    <!-- loop -->
    <video src="../videos/mp4videoWaudio.mp4" controls loop autoplay muted width="640" height="360"></video>

    <!-- poster -->
     <video src="../videos/mp4videoWaudio.mp4" controls type="videos/mp4" poster="../Images/dog.jpg"></video>
</body>
</html>
