<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <form action="URL">
        <label for="fullname">Enter fullname</label>
        <input type="text" name="fullname" id=""> <br>
        <label for="emailid">Enter emailid</label>
        <input type="email" name="emailid" id="">
        <label for="mypassword">Enter password</label>
        <input type="password" name="mypassword" id="">
        <label for="myage">Enter age</label>
        <input type="number" name="myage" id="">
        <textarea name="" id="" cols="30" rows="4"></textarea> 
        <button type="submit">Submit</button>
    </form>
        
</body>
</html>
