<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables 5</title>
</head>
<body>
    <!-- Spanning rows and Columns -->
     <h4>colspan</h4>
     <table border="2">
        <tr>
            <th colspan="3">Student Details</th>
        </tr>
        <tr>
            <td colspan="2">Name</td>
            <td>Trisha</td>
        </tr>
        <tr>
            
        </tr>
        <tr>
            <td>Courses</td>
            <td>Full Stack</td>
            <td>Gen AI</td>
        </tr>
     </table>

     <hr>
     <h4>rowspan</h4>
     <!-- Row Span -->
      <table border="2">
        <tr>
            <th rowspan="2">Day</th>
            <th>Morning</th>
            <th>Evening</th>
        </tr>
        <tr>
            <td>ReactJS Practice</td>
            <td>Backend pratice</td>
        </tr>
      </table>
</body>
</html>
