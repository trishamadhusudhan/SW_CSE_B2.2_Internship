<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors | class selector</title>
    <style>
        .Style1{
            font-size: 28px;
            background-color: cadetblue;
            color: blanchedalmond;
        }
        .Style2{
            color:brown;
        }
        .Style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="Style1">class selector</h1>
    <h1 class="Style2">Heading tag itself; but a different style</h1>
    <p class="Style3">This a new paragraph that I've created.</p>
    <p class="Style2">This is the second paragraph.</p>
</body>
</html>
