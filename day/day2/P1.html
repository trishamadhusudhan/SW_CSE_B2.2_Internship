<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image tag example</title>
</head>
<body>
    <!-- image tag: -->
    <img src="dog_image.jpg" alt="the image of a dog">
     <!-- src: source | alt: alternative text -->
     <!-- image type: jpg/jpeg | png | webp | gif -->
     <img src="dog_image.jpg" alt="the image of a dog" width="400px" height="250px">
     <!-- Title - tooltip text -->
     <!-- Relative image src -->
     <img src="/SW_CSE_B2.2_Internship/day/images/dog.jpg" alt="the image of a dog" title="My name is rocher."> 
     <!-- Responsive images: CSS -->


</body>
</html>
