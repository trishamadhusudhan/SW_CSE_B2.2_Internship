<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <p>Unordered list: list and group related items for better readability</p>
    <!-- Ul: unordered list | li: list | items are listed with bullet points -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
    </ul>

    <p>Ordered list: list the items by numbering them</p>
    <ol>
        <li>laptop</li>
        <li>phone</li>
        <li>ipad</li> 
    </ol>
</body>
</html>
