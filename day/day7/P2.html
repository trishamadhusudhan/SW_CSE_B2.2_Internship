<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tranform: translate | rotate | scale | Skew</title>
    <style>
        .box{
            transform: translateX(50px);
            background-color: burlywood;
            border: 2px solid black;
            border-radius: 10px;
        }
        .box1{
            transform: translateY(20px);
            background-color: rgb(133, 147, 211);
            border: 2px solid black;
        }
        .box2{
            transform: translate(60px 50px);
            background-color: rgb(133, 211, 143);
            border: 2px solid black;
        }
        .box3{
            transform: rotateZ(180deg);
            background-color: rgb(225, 107, 186);
            border: 2px solid black;
        }
        .box4{
            margin-left: 40px;
            /* scale, scaleX, scaleY, scale3d */
            transform: scale3d(1.2, 1.2, 1);
            width: 100px;
            height: 100px;
            background-color: rgb(211, 214, 51);
            border: 2px solid black;
            margin-top: 20px;
        }
        .box5{
            width: 100px;
            height: 100px;
            background-color: rgb(207, 129, 28);
            /* Skew: slant an element along one or both axes 
                skew(x,y) | skewX() | skewY()
            */
            transform: skew(5deg, 10deg);
        }
    </style>
</head>
<body>
    <p>CSS Tranform: property visually moves, rotate, enlarge, shrink. It 2d or 3d</p>
    <!-- Syntax -->
    tranform: transform-function(value)

    <div class="box">
        Box
    </div>
    
    <div class="box2">
        Box 2
    </div>

    <div class="box1">
        Box 1
    </div>
<br>
    <div class="box3">
        Box 3
    </div>

    <!-- translateX, translateY, translate | rotate(+/-) rotateX -->

    <div class="box4">
        Box 4
    </div>

    <br>
    <div class="box5">
        Box 5
    </div>
</body>
</html>
